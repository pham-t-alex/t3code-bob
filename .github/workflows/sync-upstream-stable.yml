name: Sync upstream stable

# Opens a PR into main for each new stable (vX.Y.Z) tag on pingdotgg/t3code.
# Needs secret UPSTREAM_SYNC_TOKEN: GITHUB_TOKEN cannot push upstream's
# .github/workflows changes. Fine-grained PAT on this repo with Contents,
# Pull requests, and Workflows set to read and write.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream-stable

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require token
        env:
          TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set the UPSTREAM_SYNC_TOKEN secret (see workflow header)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Open PR for latest upstream stable tag
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM: https://github.com/pingdotgg/t3code.git
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs "$UPSTREAM" 'v*' \
            | sed 's|.*refs/tags/||' \
            | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' \
            | sort -V | tail -n1)
          if [ -z "$tag" ]; then
            echo "::error::No stable tags found upstream."
            exit 1
          fi
          echo "Latest upstream stable: $tag"

          git fetch --no-tags "$UPSTREAM" "refs/tags/$tag:refs/tags/$tag"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "main already contains $tag."
            exit 0
          fi

          branch="upstream-sync/$tag"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git push origin "refs/tags/$tag^{commit}:refs/heads/$branch"
          fi

          # Any state: a closed PR means the release was declined.
          prs=$(gh pr list --head "$branch" --base main --state all --json number --jq length)
          if [ "$prs" != "0" ]; then
            echo "A PR for $branch already exists; skipping."
            exit 0
          fi

          gh pr create --base main --head "$branch" \
            --title "chore: merge upstream $tag" \
            --body "Upstream T3 Code stable release [$tag](https://github.com/pingdotgg/t3code/releases/tag/$tag). Review against the divergence list in FORK.md. Merge with a merge commit (not squash or rebase) so later syncs stay clean. If GitHub reports conflicts, resolve locally: \`git fetch origin && git checkout main && git merge origin/$branch\`."
